<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f2a44 0%, #2e5a88 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #243b53;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: #ffffff;
            margin-bottom: 28px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 36px 32px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        .model-tag {
            display: inline-block;
            background: #e1ecf7;
            color: #1f2a44;
            border-radius: 999px;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .price {
            font-size: 2.6rem;
            font-weight: 700;
            color: #2e5a88;
            margin-bottom: 6px;
        }

        .price-label {
            font-size: 0.9rem;
            color: #627d98;
            margin-bottom: 26px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .link {
            color: #2e5a88;
            font-weight: 600;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Prediction Result</h1>
        </header>

        <div class="card">
            <div class="model-tag">{{ model_name }}</div>
            <div class="price">{{ "%.2f"|format(prediction) }}</div>
            <div class="price-label">Estimated house price (USD)</div>

            <div class="actions">
                <a class="link" href="/">&larr; Make another prediction</a>
                <a class="link" href="/results">View model comparison</a>
            </div>
        </div>
    </div>
</body>
</html>
